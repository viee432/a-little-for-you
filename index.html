<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Something For You</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#102957,#020207 70%);
overflow:hidden;
font-family:Georgia,serif;
color:white;
}


.container{
text-align:center;
}


h1{
font-weight:normal;
font-size:24px;
margin-bottom:70px;
}


/* AREA KADO */

.scene{
perspective:900px;
}


.gift{
width:180px;
height:180px;
position:relative;
transform-style:preserve-3d;
cursor:pointer;
animation:float 3s infinite;
}


/* badan depan */

.front{
position:absolute;
width:180px;
height:150px;
bottom:0;
background:#050505;
border:1px solid #151515;
transform:translateZ(40px);
box-shadow:inset 0 0 25px #222;
}


/* sisi kanan */

.right{
position:absolute;
width:80px;
height:150px;
right:-40px;
bottom:0;
background:#101010;
transform:rotateY(60deg) translateZ(40px);
transform-origin:left;
}


/* bagian atas kotak */

.top{
position:absolute;
width:180px;
height:80px;
top:0;
background:#090909;
transform:rotateX(70deg) translateZ(40px);
transform-origin:bottom;
}


/* tutup */

.lid{
position:absolute;
width:190px;
height:35px;
top:-15px;
left:-5px;
background:#080808;
transform:translateZ(60px);
transition:1s;
z-index:5;
box-shadow:0 10px 20px black;
}


/* pita vertikal */

.ribbon-v{
position:absolute;
width:32px;
height:155px;
background:#08285b;
left:74px;
bottom:0;
z-index:4;
transform:translateZ(45px);
}


/* pita horizontal */

.ribbon-h{
position:absolute;
width:180px;
height:32px;
top:65px;
background:#08285b;
z-index:4;
transform:translateZ(50px);
}


/* pita atas */

.bow{
position:absolute;
width:55px;
height:35px;
background:#0d397c;
top:-35px;
left:63px;
border-radius:50%;
z-index:8;
transform:translateZ(80px);
}


/* buka */

.open .lid{
transform:translateY(-120px) rotateX(45deg);
}


.open{
animation:shake .5s;
}


@keyframes shake{
25%{rotate:5deg;}
50%{rotate:-5deg;}
75%{rotate:5deg;}
}


@keyframes float{
50%{
transform:translateY(-12px);
}
}



/* GLITTER */

.star{
position:absolute;
width:6px;
height:6px;
background:white;
border-radius:50%;
box-shadow:0 0 12px white;
animation:fly 1.5s forwards;
}


@keyframes fly{
to{
transform:translate(var(--x),var(--y));
opacity:0;
}
}



/* AMPLOP */

.envelope{
display:none;
width:230px;
height:150px;
background:white;
margin:auto;
border-radius:8px;
box-shadow:0 20px 40px black;
cursor:pointer;
}


/* SURAT */

.letter{
display:none;
width:280px;
padding:30px;
background:#d8bb8e;
color:#23170c;
border-radius:5px;
}


</style>

</head>

<body>


<div class="container">

<h1 id="text">
Ada sesuatu buat kamu...
</h1>


<div class="scene">

<div class="gift" id="gift" onclick="openGift()">

<div class="front"></div>
<div class="right"></div>
<div class="top"></div>

<div class="lid"></div>

<div class="ribbon-v"></div>
<div class="ribbon-h"></div>

<div class="bow"></div>

</div>

</div>


<div class="envelope" id="envelope" onclick="openLetter()">
</div>


<div class="letter" id="letter">

<h3>Untuk Kamu 🤍</h3>

<p>
Aku membuat sesuatu kecil ini khusus buat kamu.
Semoga kamu selalu semangat.
</p>

</div>


</div>


<script>


function openGift(){

let gift=document.getElementById("gift");

gift.classList.add("open");


// glitter banyak

for(let i=0;i<60;i++){

let s=document.createElement("div");

s.className="star";

s.style.left="90px";
s.style.top="60px";

s.style.setProperty("--x",
(Math.random()*400-200)+"px");

s.style.setProperty("--y",
(-Math.random()*350)+"px");


gift.appendChild(s);

}

setTimeout(()=>{

gift.style.display="none";

document.getElementById("text").innerHTML=
"Sebuah surat untuk kamu...";

document.getElementById("envelope").style.display="block";

},1700);

}



function openLetter(){

document.getElementById("envelope").style.display="none";

document.getElementById("letter").style.display="block";

}


</script>


</body>
</html>
