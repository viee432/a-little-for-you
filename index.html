<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ada Sesuatu Buat Kamu</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(#020207,#071a38,#000);
overflow:hidden;
font-family:Georgia,serif;
color:white;
}


.container{
text-align:center;
}


h1{
font-weight:normal;
font-size:24px;
margin-bottom:60px;
}


/* KADO */

.gift{
position:relative;
width:180px;
height:170px;
margin:auto;
cursor:pointer;
perspective:600px;
animation:float 3s infinite;
}


.box-front{
position:absolute;
width:180px;
height:150px;
background:#050505;
bottom:0;
border-radius:5px;
box-shadow:inset -15px 0 25px #111,
0 20px 40px black;
}


.box-side{
position:absolute;
width:45px;
height:150px;
right:-45px;
bottom:0;
background:#101010;
transform:skewY(-45deg);
transform-origin:left;
}


.lid{
position:absolute;
width:180px;
height:35px;
top:10px;
left:0;
background:#080808;
border-radius:5px;
z-index:5;
transition:1s;
box-shadow:0 10px 20px black;
}


/* PITA */

.ribbon-vertical{
position:absolute;
width:32px;
height:160px;
background:#092b61;
left:74px;
bottom:0;
z-index:3;
}


.ribbon-horizontal{
position:absolute;
width:180px;
height:32px;
background:#092b61;
top:70px;
z-index:3;
}


/* simpul */

.bow{
position:absolute;
width:45px;
height:25px;
background:#103878;
top:-10px;
left:68px;
border-radius:50%;
z-index:7;
}


/* buka */

.open .lid{
transform:translateY(-130px) rotateX(35deg);
}


.open{
animation:shake .5s;
}


@keyframes shake{

25%{transform:rotate(5deg);}
50%{transform:rotate(-5deg);}
75%{transform:rotate(5deg);}

}


@keyframes float{

50%{
transform:translateY(-12px);
}

}


/* GLITTER */

.sparkle{
position:absolute;
width:7px;
height:7px;
background:white;
border-radius:50%;
box-shadow:0 0 10px white;
animation:fly 1.5s forwards;
}


@keyframes fly{

from{
transform:translate(0,0);
opacity:1;
}

to{
transform:translate(var(--x),var(--y));
opacity:0;
}

}



/* AMPLOP */

.envelope{

display:none;
width:230px;
height:150px;
background:white;
margin:auto;
position:relative;
border-radius:8px;
box-shadow:0 20px 40px black;
cursor:pointer;
animation:appear 1s;
}


.envelope:before{

content:"";
position:absolute;
top:0;
left:0;

border-left:115px solid transparent;
border-right:115px solid transparent;
border-top:85px solid #e8e8e8;

}


/* SURAT */

.letter{

display:none;
width:280px;
background:#d7b98a;
color:#24160b;
padding:30px;
border-radius:5px;
box-shadow:0 20px 40px black;
animation:appear 1s;

}


@keyframes appear{

from{
opacity:0;
transform:translateY(50px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>


<body>


<div class="container">


<h1 id="title">
Ada sesuatu buat kamu...
</h1>



<div class="gift" id="gift" onclick="openGift()">

<div class="box-front"></div>

<div class="box-side"></div>

<div class="lid"></div>

<div class="ribbon-vertical"></div>

<div class="ribbon-horizontal"></div>

<div class="bow"></div>

</div>



<div class="envelope" id="envelope" onclick="openLetter()">

</div>



<div class="letter" id="letter">

<h3>Untuk Kamu 🤍</h3>

<p>
Aku membuat sesuatu kecil ini khusus buat kamu.<br><br>
Semoga kamu selalu kuat dan semangat.
Aku selalu percaya sama kamu.
</p>

</div>


</div>


<script>


function openGift(){

let gift=document.getElementById("gift");

gift.classList.add("open");


// glitter banyak

for(let i=0;i<45;i++){

let star=document.createElement("div");

star.className="sparkle";

star.style.left="85px";
star.style.top="50px";

star.style.setProperty("--x",
(Math.random()*300-150)+"px");

star.style.setProperty("--y",
(-Math.random()*300)+"px");


gift.appendChild(star);


setTimeout(()=>{
star.remove();
},1600);

}



setTimeout(()=>{

gift.style.display="none";

document.getElementById("title").innerHTML=
"Sebuah surat untuk kamu...";

document.getElementById("envelope").style.display="block";


},1500);


}



function openLetter(){

document.getElementById("envelope").style.display="none";

document.getElementById("letter").style.display="block";

}


</script>


</body>
</html>
