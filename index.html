<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You</title>

<style>

*{
box-sizing:border-box;
}


body{
margin:0;
height:100vh;
overflow:hidden;
background:linear-gradient(#020207,#071b3d,#000);
font-family:Georgia,serif;
color:white;
}


/* BINTANG JATUH */

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
box-shadow:0 0 12px white;
animation:jatuh linear infinite;
}


@keyframes jatuh{

from{
transform:translateY(-20px) translateX(0);
opacity:0;
}

20%{
opacity:1;
}

to{
transform:translateY(100vh) translateX(100px);
opacity:0;
}

}


/* TOMBOL */

#button{

position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:10;
padding:15px 45px;

background:#071a38;

border:2px solid #8bbcff;

border-radius:40px;

font-size:25px;

cursor:pointer;

box-shadow:0 0 25px #163e80;

}



/* TEMPAT CHAT */

.chat-area{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

pointer-events:none;

}



/* BUBBLE */

.chat{
position:absolute;

background:#0b2858;
border:1px solid #426aa5;

color:white;

padding:14px 18px;

border-radius:25px;

max-width:42%;

text-align:center;

font-size:14px;

box-shadow:
0 8px 20px black,
inset 0 0 15px #163d78;

animation:
muncul .8s forwards,
ngambang 4s ease-in-out infinite;

opacity:0;
}


@keyframes muncul{

from{
transform:translate(-50%,-50%) scale(0);
}

to{
transform:translate(0,0) scale(1);
opacity:1;
}

}


@keyframes ngambang{

0%,100%{
margin-top:0;
}

50%{
margin-top:-25px;
}

}



/* keluar dari tengah */

@keyframes pecah{

from{

transform:
translate(-50%,-50%)
scale(0);

opacity:0;

}


to{

transform:
translate(var(--x),var(--y))
scale(1);

opacity:1;

}

}



/* gerak setelah menyebar */

@keyframes melayang{

0%,100%{

margin-top:0;
}

50%{

margin-top:-25px;

}

}



</style>

</head>


<body>



<div id="button" onclick="mulai()">
Tekan
</div>



<div class="chat-area" id="chatArea"></div>




<script>


// bintang

for(let i=0;i<40;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"%";

star.style.animationDuration=
(2+Math.random()*4)+"s";

star.style.animationDelay=
Math.random()*5+"s";

document.body.appendChild(star);

}




let pesan=[

"aku bangga sama kamuu sayangg 🤍",

"semangatt yaa sayangnya aku",

"love youu sayanggg ❤️",

"sehat selalu yaa sayangg",

"terima kasihh buat semuanya sayang",

"maaf yaa kalo aku buat masalah terus",

"intinya aku sayang kamu 🤍",

"semoga impian kamu tercapai",

"aku bakal dukung kamu terus",

"cepat sembuh yaa sayangku cintaku gantengkuu"

];




function mulai(){


document.getElementById("button").style.display="none";


let area=document.getElementById("chatArea");



pesan.forEach((isi,index)=>{


setTimeout(()=>{


let chat=document.createElement("div");


chat.className="chat";

chat.innerHTML=isi;



// posisi menyebar dari tengah

let arah=index%2==0 ? 1 : -1;


let kiri = index < 5;

let posisiX;

if(kiri){

posisiX = -150 - (index*10);

}else{

posisiX = 50 + ((index-5)*10);

}


let posisiY = -180 + ((index%5)*90);


chat.style.left="50%";
chat.style.top="50%";

chat.style.setProperty("--x",posisiX+"px");
chat.style.setProperty("--y",posisiY+"px");

chat.style.transform=
`translate(${posisiX}px,${posisiY}px)`;



chat.style.setProperty("--x",x+"px");

chat.style.setProperty("--y",y+"px");



area.appendChild(chat);



},index*300);



});



}



</script>


</body>
</html>
