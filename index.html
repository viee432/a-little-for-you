<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You</title>

<style>

*{
box-sizing:border-box;
}


body{
margin:0;
height:100vh;
overflow:hidden;
background:
radial-gradient(circle at top,#102957,#020207 60%);
font-family:Georgia,serif;
color:white;
}


/* BINTANG JATUH */

.star{
position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
box-shadow:0 0 10px white;
animation:fall linear infinite;
}


@keyframes fall{

0%{
transform:translateY(-20px) translateX(0);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(100vh) translateX(80px);
opacity:0;
}

}



/* TOMBOL */

#button{

position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);

padding:15px 45px;

border-radius:30px;

border:2px solid #b9d7ff;

background:#071a38;

color:white;

font-size:25px;

cursor:pointer;

box-shadow:0 0 20px #123c80;

}



/* AREA CHAT */


.chat-area{

position:absolute;

bottom:-10px;

left:50%;

transform:translateX(-50%);

width:90%;

display:flex;

flex-direction:column;

align-items:center;

gap:18px;

}



/* BUBBLE */


.chat{

max-width:85%;

background:#0b2858;

border:1px solid #4169a1;

padding:14px 22px;

border-radius:25px;

font-size:15px;

text-align:center;

box-shadow:
0 8px 20px rgba(0,0,0,.6),
inset 0 0 15px #153d78;


animation:move 9s linear forwards;

}



@keyframes move{


0%{

transform:translateY(100px);

opacity:0;

}


15%{

opacity:1;

}


100%{

transform:translateY(-750px);

opacity:0;

}


}



</style>

</head>


<body>



<div id="button" onclick="mulai()">
Tekan
</div>



<div class="chat-area" id="chatArea">

</div>



<script>


// membuat bintang jatuh

for(let i=0;i<35;i++){

let star=document.createElement("div");

star.className="star";


star.style.left=Math.random()*100+"%";

star.style.animationDuration=
(2+Math.random()*4)+"s";


star.style.animationDelay=
Math.random()*5+"s";


document.body.appendChild(star);

}




let pesan=[

"aku bangga sama kamuu sayangg 🤍",

"semangatt yaa sayangnya aku",

"love youu sayanggg ❤️",

"sehat selalu yaa sayangg",

"terima kasihh buat semuanya sayang",

"maaf yaa kalo aku buat masalah terus",

"intinya aku sayang kamu 🤍",

"semoga impian kamu tercapai",

"aku bakal dukung kamu terus",

"cepat sembuh yaa sayangku cintaku gantengkuu"

];




function mulai(){


document.getElementById("button").style.display="none";


let area=document.getElementById("chatArea");



pesan.forEach((isi,index)=>{


setTimeout(()=>{


let chat=document.createElement("div");


chat.className="chat";


chat.innerHTML=isi;


area.appendChild(chat);



},index*900);



});



}



</script>



</body>
</html>
